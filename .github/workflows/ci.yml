# CI: myelin's gate, scripts/check.sh (what `make check` runs), on every
# push to main and every pull request.
#
# It runs on GitHub's runners, and only once myelin is public (D8): the
# org's free minutes for private repositories are spent, and myelin has no
# self-hosted runner. While myelin is private the job is skipped, and the
# gate is a green local `make check` before each push. Going public needs no
# change here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go, msgp and TinyGo at the versions mise.toml pins, as in an agent
      # shell.
      - uses: jdx/mise-action@v4

      - run: ./scripts/check.sh

      # The floor importers build with: the root module under go.mod's go
      # directive. myelintea needs a newer Go for Bubble Tea, so the gate
      # above is its check.
      - name: root module at its go.mod floor
        run: |
          export GOTOOLCHAIN=go$(go list -m -f '{{.GoVersion}}')
          go vet ./...
          go test ./...
          go -C key vet ./...
          go -C key test ./...
